<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Присъствие</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EAF5FD">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Присъствие">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --board: #0C8FD5;
    --board-dark: #0A6FA8;
    --accent: #8EC5FF;
    --paper: #F4F8FB;
    --ink: #1B2A3D;
    --muted: #5B6B80;
    --line: #D3DEEC;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Rubik', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* ---------- начален екран ---------- */
  #home { max-width: 520px; margin: 0 auto; padding: 0 0 32px; }
  header {
    /* карирана тетрадка в светлосиньо */
    background-color: #EAF5FD;
    background-image:
      linear-gradient(rgba(12, 143, 213, 0.11) 1px, transparent 1px),
      linear-gradient(90deg, rgba(12, 143, 213, 0.11) 1px, transparent 1px);
    background-size: 22px 22px;
    background-position: -1px -1px;
    padding: 28px 24px 0;
    border-radius: 0 0 26px 26px;
    position: relative;
    overflow: hidden;
  }
  /* червената линия в полето, като в ученическа тетрадка */
  header::before {
    content: ''; position: absolute; top: 0; bottom: 0; left: 18px;
    width: 2px; background: rgba(230, 90, 90, 0.35);
  }
  header > * { position: relative; }
  .logo { display: block; width: 240px; max-width: 78%; height: auto; margin: 0 0 22px; }
  .titlebar { padding: 16px 0 20px; border-top: 2px solid rgba(12, 143, 213, 0.25); }
  header h1 { margin: 0; font-size: 26px; font-weight: 700; color: #111; }
  .today { margin: 4px 0 0; font-size: 15px; font-weight: 700; color: var(--muted); }
  .today b { color: var(--ink); font-weight: 700; }

  h2 { font-size: 17px; font-weight: 700; margin: 26px 20px 0; }

  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    padding: 14px 20px 0;
  }
  .tile { position: relative; }
  .tile.wide { grid-column: 1 / -1; }
  .open-btn {
    font: inherit; width: 100%; border: 2px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 16px; padding: 20px 6px 16px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .open-btn .num { font-size: 30px; font-weight: 700; line-height: 1; }
  .tile.wide .open-btn { flex-direction: row; justify-content: center; padding: 18px 16px; text-align: center; }
  .tile.wide .open-btn .num { font-size: 17px; font-weight: 500; line-height: 1.3; }
  .open-btn .lbl { font-size: 13px; font-weight: 700; color: var(--muted); }
  .open-btn:active { background: var(--board); color: #fff; border-color: var(--board); }
  .open-btn:active .lbl { color: #D6E6FA; }
  .tile.last .open-btn { box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--c); }

  /* цвят по етап */
  .tile { --c: #0C8FD5; --bg: #E7F4FC; }
  .tile.g-primary { --c: #0C8FD5; --bg: #E7F4FC; }   /* 2.–4. клас */
  .tile.g-middle  { --c: #1E9E5A; --bg: #E6F6EC; }   /* 5.–7. клас */
  .tile.g-high    { --c: #5B47C7; --bg: #EEEBFB; }   /* 10.–12. клас */
  .tile.g-subject { --c: #D2721F; --bg: #FFF1E2; }   /* предмети */
  .tile .open-btn { background: var(--bg); border-color: transparent; }
  .tile .open-btn .num { color: var(--c); }
  .tile.wide .open-btn .num { color: var(--c); font-weight: 700; }
  .tile .open-btn:active { background: var(--c); border-color: var(--c); }
  .tile .open-btn:active .num, .tile .open-btn:active .lbl { color: #fff; }

  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }


  /* ---------- екран с приложението ---------- */
  #app { display: none; height: 100%; flex-direction: column; }
  #app.open { display: flex; }
  .bar {
    background: var(--board); color: #fff;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; flex-shrink: 0;
  }
  .bar button {
    font: inherit; font-size: 15px; background: var(--board-dark); color: #fff;
    border: none; border-radius: 10px; padding: 9px 14px; cursor: pointer;
  }
  .bar strong { font-size: 17px; font-weight: 500; }
  #frameHolder { flex: 1; display: flex; }
  iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  .error {
    margin: 40px 24px; padding: 18px; background: #fff; border: 2px solid #E8B4A8;
    border-radius: 14px; line-height: 1.5;
  }
</style>
</head>

    <div class="titlebar">
      <h1>Присъствие</h1>
      <p class="today" id="today"></p>
    </div>
  </header>
  <div id="lists"></div>
</div>

<div id="app">
  <div class="bar">
    <button onclick="goHome()">‹ Класове</button>
    <strong id="appTitle"></strong>
  </div>
  <div id="frameHolder"></div>
</div>

<script>
  // ====================================================================
  //  ТУК ПОСТАВЕТЕ ЛИНКОВЕТЕ КЪМ ПРИЛОЖЕНИЯТА НА ВСЕКИ КЛАС
  //  (линкът от Deploy → Manage deployments → Web app URL, завършва на /exec)
  // ====================================================================
  const CLASSES = [
    { num: '2',  label: 'клас', group: 'primary', url: 'ПОСТАВИ_ЛИНК' },
    { num: '3',  label: 'клас', group: 'primary', url: 'ПОСТАВИ_ЛИНК' },
    { num: '4',  label: 'клас', group: 'primary', url: 'ПОСТАВИ_ЛИНК' },
    { num: '5',  label: 'клас', group: 'middle',  url: 'ПОСТАВИ_ЛИНК' },
    { num: '6',  label: 'клас', group: 'middle',  url: 'ПОСТАВИ_ЛИНК' },
    { num: '7',  label: 'клас', group: 'middle',  url: 'ПОСТАВИ_ЛИНК' },
    { num: '10', label: 'клас', group: 'high',    url: 'ПОСТАВИ_ЛИНК' },
    { num: '11', label: 'клас', group: 'high',    url: 'ПОСТАВИ_ЛИНК' },
    { num: '12', label: 'клас', group: 'high',    url: 'ПОСТАВИ_ЛИНК' },
    { num: 'Физика, Химия, География, История', label: '', group: 'subject', url: 'ПОСТАВИ_ЛИНК', wide: true }
  ];
  // ====================================================================

  // ---------- памет на телефона (последно отворен клас) ----------
  function load(key, fallback) {
    try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
    catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }
  let lastOpened = load('lastOpened', null);

  function titleOf(c) { return c.label ? c.num + '. ' + c.label : c.num; }

  // ---------- днешна дата ----------
  function showToday() {
    const d = new Date();
    const days = ['Неделя', 'Понеделник', 'Вторник', 'Сряда', 'Четвъртък', 'Петък', 'Събота'];
    const months = ['януари', 'февруари', 'март', 'април', 'май', 'юни', 'юли', 'август', 'септември', 'октомври', 'ноември', 'декември'];
    const el = document.getElementById('today');
    el.textContent = '';
    const b = document.createElement('b');
    b.textContent = days[d.getDay()];
    el.appendChild(b);
    el.appendChild(document.createTextNode(', ' + d.getDate() + ' ' + months[d.getMonth()]));
  }

  // ---------- плочки ----------
  function makeTile(c) {
    const tile = document.createElement('div');
    tile.className = 'tile' + (c.group ? ' g-' + c.group : '') + (c.wide ? ' wide' : '') + (lastOpened === c.num ? ' last' : '');

    const open = document.createElement('button');
    open.className = 'open-btn';
    open.setAttribute('aria-label', 'Отвори ' + titleOf(c));
    const n = document.createElement('span'); n.className = 'num'; n.textContent = c.label ? c.num + '.' : c.num;
    open.appendChild(n);
    if (c.label) {
      const l = document.createElement('span'); l.className = 'lbl'; l.textContent = c.label;
      open.appendChild(l);
    }
    open.onclick = function() { openClass(c); };
    tile.appendChild(open);

    return tile;
  }

  function makeGrid(list) {
    const g = document.createElement('div');
    g.className = 'grid';
    list.forEach(function(c) { g.appendChild(makeTile(c)); });
    return g;
  }

  function render() {
    const root = document.getElementById('lists');
    root.innerHTML = '';
    const h = document.createElement('h2'); h.textContent = 'Изберете клас:';
    root.appendChild(h);
    root.appendChild(makeGrid(CLASSES));
  }

  // ---------- отваряне на клас ----------
  function openClass(c) {
    lastOpened = c.num;
    save('lastOpened', lastOpened);
    document.getElementById('appTitle').textContent = titleOf(c);
    const holder = document.getElementById('frameHolder');
    holder.innerHTML = '';
    if (!c.url || c.url.indexOf('https://') !== 0) {
      const d = document.createElement('div');
      d.className = 'error';
      d.textContent = 'Линкът за ' + titleOf(c) + ' още не е поставен. Отворете index.html и сложете Web app линка на този клас в списъка CLASSES.';
      holder.appendChild(d);
    } else {
      const f = document.createElement('iframe');
      f.src = c.url;
      f.title = 'Присъствие — ' + titleOf(c);
      holder.appendChild(f);
    }
    document.getElementById('home').style.display = 'none';
    document.getElementById('app').classList.add('open');
    history.pushState({ open: c.num }, '');
  }

  function goHome() {
    document.getElementById('app').classList.remove('open');
    document.getElementById('frameHolder').innerHTML = '';
    document.getElementById('home').style.display = 'block';
    showToday();
    render();
  }

  // бутонът "Назад" на телефона връща към класовете, вместо да затвори приложението
  window.addEventListener('popstate', function() {
    if (document.getElementById('app').classList.contains('open')) goHome();
  });

  // датата се опреснява, ако приложението стои отворено след полунощ
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) showToday();
  });

  showToday();
  render();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function() {});
  }
</script>
</body>
</html>
